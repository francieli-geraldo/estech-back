server:
  port: ${ENV_SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_SERVER}:3306/${DATABASE}?createDatabaseIfNotExist=true
    username: ${DBUSERNAME}
    password: ${DBPASSWORD}
    hikari:
      connectionTimeout: 60000
      idleTimeout: 600000
      maxLifetime: 1800000
  mail:
    host: h58.servidorhh.com
    port: 587
    username: suporte@scsoftware.com.br
    password: ONk3mnyeU
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    show-sql: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: false
    url: jdbc:mysql://${DB_SERVER}:3306/${DATABASE}?createDatabaseIfNotExist=true
    user: ${DBUSERNAME}
    password: ${DBPASSWORD}
    baseline-on-migrate: true
    locations: classpath:db/migration
logging:
  level:
    org:
      hibernate:
        SQL=DEBUG:
jwt:
  secret: ${JWT_SECRET}