server:
  port: ${ENV_SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_estech_prd?createDatabaseIfNotExist=true
    username: root
    password: root
    hikari:
      connectionTimeout: 60000
      idleTimeout: 600000
      maxLifetime: 1800000
  jpa:
    show-sql: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        format_sql: true
#        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: false
    url: jdbc:mysql://server:3306/databasename?createDatabaseIfNotExist=true
    user: user
    password: password
    baseline-on-migrate: true
    locations: classpath:db/migration
logging:
  level:
    org:
      hibernate:
        SQL=DEBUG:
jwt:
  secret: 1ed1f97f-3390-4aaa-87e4-d8f87a568c15
