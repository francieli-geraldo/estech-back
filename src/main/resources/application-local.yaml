server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/afinese-prd
    username: root
    password: root

  jpa:
    show-sql: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    url: jdbc:mysql://localhost:3306/afinese-prd
    user: root
    password: root
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: TRACE